<html lang="ko">
<head>

  <title>Wine Archive</title>
  <style>

    .backdrop{position:fixed;inset:0;background:#26140d99;display:none;z-index:10}.backdrop.open{display:block}.panel{position:fixed;right:0;top:0;transform:translateX(110%);visibility:hidden;pointer-events:none;width:min(450px,94vw);height:100vh;height:100dvh;background:var(--paper);padding:0 34px 34px;box-shadow:-20px 0 60px #21100766;transition:transform .35s,visibility 0s .35s;z-index:11;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}.panel.open{transform:translateX(0);visibility:visible;pointer-events:auto;transition:transform .35s}.panel-head{position:sticky;top:0;z-index:3;display:flex;align-items:center;justify-content:space-between;min-height:62px;background:linear-gradient(var(--paper) 78%,#f7efdf00);padding:10px 0 15px}.panel-kicker{color:#a07859;font-size:11px;letter-spacing:.16em}.close{border:0;border-radius:999px;background:#eadcc4;color:#67442d;min-height:42px;padding:0 14px;font-weight:700;cursor:pointer}.panel h2{font:32px/1.1 Georgia;margin:14px 0 7px}.large-date{color:#997052;font-size:13px;margin-bottom:28px}.section{border-top:1px solid #d4bea0;padding:17px 0}.section b{display:block;font-size:10px;letter-spacing:.12em;color:#9c7152;margin-bottom:8px}.community-score{display:flex;align-items:baseline;gap:9px}.community-score strong{font:32px Georgia}.community-stars{color:#bb4a2d;font-size:18px}.community-count{color:#9a7658;font-size:12px}.rating-row{display:grid;grid-template-columns:44px 1fr 42px;align-items:center;gap:8px;margin:10px 0}.stars{display:flex;gap:1px}.star{padding:2px;border:0;background:transparent;color:#cbb99e;font-size:25px;line-height:1;cursor:pointer}.star.selected,.star:hover{color:#b14d31}.rating-value,.rating-summary{color:#8e684c;font-size:12px}.rating-value{text-align:right}.note{font:17px/1.6 Georgia}.panel-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}.edit,.delete{width:100%;border-radius:12px;padding:12px;cursor:pointer}.edit{border:0;background:#74412c;c     .form-sheet{position:fixed;inset:0;z-index:20;background:#2c180fcc;display:none;align-items:flex-end;justify-content:center;padding:18px}.form-sheet.open{display:flex}.form-card{width:min(680px,100%);max-height:94vh;overflow:auto;background:var(--paper);border-radius:24px 24px 14px 14px;padding:24px;box-shadow:0 25px 80px #160b07}.form-head{display:flex;align-items:center;justify-content:space-between;position:sticky;top:-24px;background:var(--paper);padding:6px 0 14px;z-index:2}.form-head h2{font:30px Georgia;margin:0}.form-close{border:0;background:transparent;font-size:26px;cursor:pointer}.upload-box{display:grid;place-items:center;min-height:170px;border:2px dashed #b79873;border-radius:18px;background:#ead9ba88;cursor:pointer;overflow:hidden;text-align:center;padding:15px}.upload-box img{max-height:260px;max-width:100%;border-radius:10px}.upload-box strong{display:block;margin-bottom:5px}.ocr-status{min-height:20px;color:#876349;font-size:12px;margin:8px 2px 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:#79563e}.field input,.field textarea,.field select{width:100%;border:1px solid #cdb89b;background:#fffaf0;border-radius:12px;padding:12px 13px;font-size:16px;color:#3e2b1f}.field textarea{min-height:84px;resize:vertical}.help{font-size:11px;color:#99775d}.form-rating{display:flex;gap:3px}.form-rating .star{font-size:31px}.save{width:100%;border:0;border-radius:14px;background:#74412c;color:white;padding:15px;font-weight:700;cursor:pointer;margin-top:5px}.save:disabled{opacity:.55;cursor:wait}
    .empty-state{color:#f4e3c8;align-self:center;padding:40px;white-space:nowrap}
    .login-gate{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(430px,100%);background:var(--paper);border:10px solid #7a4b2d;border-radius:18px;padding:32px;box-shadow:0 24px 70px #4b281d55;text-align:center}.login-card h1{font:36px Georgia;margin:0 0 12px}.login-card p{color:#806047;line-height:1.6}.login-options{display:grid;gap:10px;margin-top:24px}.login-option,.logout{border:0;border-radius:12px;background:#74412c;color:white;padding:13px;cursor:pointer;font-weight:700}.login-option:disabled{opacity:.55}.login-message{min-height:22px;margin-top:14px;color:#8b5e43;font-size:12px}.logout{padding:8px 11px;font-size:11px;background:#98664a}
    @media(max-width:600px){.wrap{padding:18px 10px 110px}header{margin:0 8px 24px}.wall{padding:16px 8px 8px;border-width:9px}.shelf{padding-left:12px;gap:15px}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.fab{right:16px;bottom:16px}.panel{width:100vw;padding:0 24px calc(30px + env(safe-area-inset-bottom))}.panel-head{padding-top:max(10px,env(safe-area-inset-top))}.rating-row{grid-template-columns:38px 1fr 38px}.form-sheet{padding:0;align-items:flex-end}.form-card{border-radius:22px 22px 0 0;max-height:96vh}}
  </style>
</head>
<body>
  <section class="login-gate" id="loginGate"><div class="login-card"><h1>Wine Archive</h1><p>하윤과 제권만 사용하는 와인장입니다.<br>이메일로 받은 로그인 링크를 열어주세요.</p><div class="login-options"><button class="login-option" data-login-email="gkdbs1249@naver.com">하윤으로 로그인</button><button class="login-option" data-login-email="wprnjs1213@naver.com">제권으로 로그인</button></div><div class="login-message" id="loginMessage"></div></div></section>
  <div class="wrap" id="appShell" hidden>
    <header><div class="brand">Wine Archive</div><div class="header-actions"><span class="sync-status" id="syncStatus">연결 중…</span><div class="profiles" aria-label="로그인 사용자"><button class="profile" data-person="하윤" disabled>하윤</button><button class="profile" data-person="제권" disabled>제권</button></div><button class="logout" id="logoutButton">로그아웃</button></div></header>
    <main class="wall"><section class="shelf" id="shelf"></section><div class="drawer" id="drawerCount">2026 · WINE ARCHIVE</div></main>
  </div>
  <button class="fab" id="addButton" hidden>＋ 새 와인</button>

  <div class="backdrop" id="backdrop"></div>
  <aside class="panel" id="panel" role="dialog" aria-modal="true" aria-hidden="true" aria-label="와인 상세">
    <div class="panel-head"><span class="panel-kicker">WINE RECORD</span><button class="close" id="panelClose" aria-label="와인장으로 돌아가기">← 와인장</button></div><h2 id="detailName"></h2><div class="large-date" id="detailDate"></div>
    <div class="section"><b>와인 정보</b><span id="detailInfo"></span></div><div class="section"><b>나라</b><span id="detailCountry"></span></div><div class="section"><b>외부 평점</b><div class="community-score"><strong id="externalScore">—</strong><span class="community-stars" id="externalStars"></span><span class="community-count" id="externalCount"></span></div></div><div class="section"><b>우리의 별점</b><div id="personalRatings"></div><div class="rating-summary" id="ratingSummary"></div></div><div class="section"><b>함께 마신 사람</b><span id="detailPeople"></span></div><div class="section"><b>마신 장소</b><span id="detailPlace"></span></div><div class="section"><b>함께 먹은 음식</b><span id="detailFood"></span></div><div class="section"><b>메모</b><div class="note" id="detailNote"></div></div><div class="panel-actions"><button class="edit" id="editButton">기록 수정</button><button class="delete" id="deleteButton">삭제</button></div>
  </aside>

  <div class="form-sheet" id="formSheet" role="dialog" aria-modal="true" aria-label="새 와인 등록">
    <form class="form-card" id="wineForm">
      <div class="form-head"><h2 id="formTitle">새 와인</h2><button type="button" class="form-close" id="formClose" aria-label="닫기">×</button></div>
      <label class="upload-box" for="wineImage"><input id="wineImage" name="wineImage" type="file" accept="image/*" hidden><div id="uploadPrompt"><strong>Vivino 화면 이미지 올리기</strong><span>와인명·빈티지·평점을 자동으로 읽어볼게요.</span></div><img id="uploadPreview" alt="선택한 이미지 미리보기" hidden></label>
      <div class="ocr-status" id="ocrStatus"></div>
      <div class="grid">
        <div class="field full"><label for="wineName">와인 이름</label><input id="wineName" name="wineName" required placeholder="사진에서 자동 인식 후 확인해주세요"></div><div class="field"><label for="vintage">빈티지</label><input id="vintage" name="vintage" inputmode="numeric" placeholder="예: 2018"></div><div class="field"><label for="country">나라</label><input id="country" name="country" placeholder="예: 이탈리아"></div><div class="field"><label for="externalScoreInput">외부 평점</label><input id="externalScoreInput" name="externalScore" inputmode="decimal" placeholder="예: 3.7"></div><div class="field"><label for="externalCountInput">평가 수</label><input id="externalCountInput" name="externalCount" placeholder="예: 2,859 ratings"></div><div class="field"><label for="drinkDate">마신 날짜</label><input id="drinkDate" name="drinkDate" type="date" required></div><div class="field"><label for="people">누구랑?</label><input id="people" name="people" placeholder="예: 제권과"></div><div class="field"><label for="place">어디서?</label><input id="place" name="place" placeholder="예: 집에서"></div><div class="field"><label for="food">뭐랑?</label><input id="food" name="food" placeholder="예: 스테이크와"></div><div class="field full"><label>내 별점</label><div class="form-rating" id="formRating"></div><input id="initialRating" type="hidden"><span class="help" id="ratingHelp"></span></div><div class="field full"><label for="note">메모</label><textarea id="note" name="note" placeholder="향, 맛, 다시 마시고 싶은지 등을 적어주세요."></textarea></div>
      </div><button class="save" id="saveButton" type="submit">와인장에 올리기</button>
    </form>
  </div>

  <script src="vendor/browser-deps/tesseract-5.1.1.min.js"></script><script src="vendor/browser-deps/supabase-2.117.3.min.js"></script><script src="supabase-config.js"></script><script src="wine-auth.js?v=private-archive-1"></script><script src="rating.js"></script><script src="wine-store.js"></script><script src="wine-import.js"></script><script src="wine-sync.js?v=private-archive-2"></script><script src="wine-editor.js"></script><script src="panel-state.js"></script><script src="image-utils.js"></script><script src="bottle-cutout.js"></script><script src="sync-guard.js?v=safari-rest-1"></script><script src="session-guard.js?v=private-archive-1"></script><script src="sync-retry.js"></script>
  <script>
    const baseWines=[];
    const raters=['하윤','제권'];let activePerson='하윤';let authClient=null;let authSession=null;let authSubscription=null;let currentWine=null;let editingWineId=null;let editingWineSnapshot=null;let formRatingDirty=false;let formSaving=false;let formEpoch=0;let bottleImageData='';let imageProcessing=false;let imageTaskId=0;let wines=[...baseWines];let ratings={};let sync=null;let liveChannel=null;let pollTimer=null;let realtimeHealthy=false;let subscriptionAttempt=0;let syncEpoch=0;let loadSequence=0;let startPromise=null,startPromiseGeneration=-1;let migrationBlocked=false;const authGuard=SessionGuard.createSessionGuard();const syncRetry=SyncRetry.createSyncRetryController({retry:retrySharedConnection,delay:10000});const ratingWriteQueue=WineRatings.createWriteQueue();const mutationGuard=SyncGuard.createMutationGuard(()=>loadSharedData(true));const $=id=>document.getElementById(id);const displayDate=value=>value?value.replaceAll('-','. '):'날짜 미입력';const wineInfo=w=>w.info||[w.vintage,w.name].filter(Boolean).join(' · ');
    function setSyncStatus(text,type='',retry=null){const status=$('syncStatus');status.textContent=text;status.className=`sync-status ${type}`.trim();status.onclick=retry;status.style.cursor=retry?'pointer':''}
    function setSavedStatus(){if(!sync)setSyncStatus('이 기기에 저장','ok');else if(realtimeHealthy)setSyncStatus('동기화됨','ok');else setSyncStatus('저장됨 · 실시간 연결 지연','error',subscribeShared)}
    function beginMutation(){mutationGuard.begin();loadSequence++}function endMutation(){mutationGuard.end();loadSequence++}
    function renderProfiles(){document.querySelectorAll('.profile').forEach(button=>button.classList.toggle('active',button.dataset.person===activePerson));$('ratingHelp').textContent=`${activePerson}의 별점을 선택하세요.`}
    function teardownSync(){authGuard.invalidate();syncEpoch++;syncRetry.stop();stopPolling();subscriptionAttempt++;const previous=liveChannel;liveChannel=null;if(previous&&typeof previous.unsubscribe==='function')previous.unsubscribe();sync=null;realtimeHealthy=false}
    function clearPrivateUi(){formEpoch++;imageTaskId++;formSaving=false;imageProcessing=false;editingWineId=null;editingWineSnapshot=null;formRatingDirty=false;currentWine=null;bottleImageData='';$('panel').classList.remove('open');$('formSheet').classList.remove('open');$('backdrop').classList.remove('open');document.body.classList.remove('detail-open');document.body.style.top='';$('wineForm').reset();$('uploadPreview').removeAttribute('src');$('uploadPreview').hidden=true;['detailName','detailDate','detailInfo','detailCountry','externalScore','externalStars','externalCount','detailPeople','detailPlace','detailFood','detailNote','personalRatings','ratingSummary'].forEach(id=>$(id).textContent='');wines=[];ratings={};renderShelf();updateFormControls()}
    function showLogin(message=''){teardownSync();migrationBlocked=false;authSession=null;clearPrivateUi();$('loginGate').hidden=false;$('appShell').hidden=true;$('addButton').hidden=true;$('loginMessage').textContent=message}
    async function getAccessToken(generation=authGuard.snapshot(),expectedUserId=authSession?.user?.id){if(!authGuard.isCurrent(generation))throw new Error('Authentication session changed');const {data,error}=await authClient.auth.getSession();if(error)throw error;const session=data.session;if(!authGuard.isCurrent(generation)||session?.user?.id!==expectedUserId||!WineAuth.personForSession(session))throw new Error('Authentication session changed');return session.access_token}
    function createAuthenticatedRest(generation=authGuard.snapshot(),expectedUserId=authSession?.user?.id){const client=WineSync.createRest(SUPABASE_CONFIG,undefined,()=>getAccessToken(generation,expectedUserId),authGuard.signal(generation));return SessionGuard.guardClient(client,authGuard,generation)}
    async function handleSession(session){const person=WineAuth.personForSession(session);if(!person){showLogin(session?'허용되지 않은 계정입니다.':'');if(session)try{await authClient.auth.signOut()}catch(error){console.error(error)}return}const sameUser=authSession?.user?.id===session.user.id;if(sameUser){authSession=session;if(sync||migrationBlocked)return}teardownSync();clearPrivateUi();migrationBlocked=false;authSession=session;activePerson=person;$('loginGate').hidden=true;$('appShell').hidden=false;$('addButton').hidden=false;$('loginMessage').textContent='';renderProfiles();await startApp()}
    async function initializeAuth(){if(!window.supabase||!window.SUPABASE_CONFIG){showLogin('로그인 서비스를 불러오지 못했어요.');return}authClient=window.supabase.createClient(SUPABASE_CONFIG.url,SUPABASE_CONFIG.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const listener=authClient.auth.onAuthStateChange((_event,session)=>setTimeout(()=>handleSession(session).catch(error=>showLogin(error.message)),0));authSubscription=listener.data.subscription;const {data,error}=await authClient.auth.getSession();if(error){showLogin(error.message);return}await handleSession(data.session)}
    document.querySelectorAll('[data-login-email]').forEach(button=>button.onclick=async()=>{document.querySelectorAll('[data-login-email]').forEach(item=>item.disabled=true);$('loginMessage').textContent='로그인 링크를 보내는 중…';try{const redirectTo=`${location.origin}${location.pathname}`;await WineAuth.sendMagicLink(authClient,button.dataset.loginEmail,redirectTo);$('loginMessage').textContent='이메일로 보낸 로그인 링크를 열어주세요.'}catch(error){$('loginMessage').textContent=error.message||'로그인 링크를 보내지 못했어요.'}finally{document.querySelectorAll('[data-login-email]').forEach(item=>item.disabled=false)}});$('logoutButton').onclick=async()=>{showLogin('로그아웃 중…');try{await authClient.auth.signOut()}catch(error){console.error(error)}finally{showLogin('로그아웃되었습니다.')}};
    function appendBottle(item,w){const safeImage=WineSync.safeImage(w.image);if(safeImage){const image=document.createElement('img');image.className='photo-bottle';image.src=safeImage;image.alt=w.name;item.appendChild(image);return}const bottle=document.createElement('div');bottle.className='bottle';const neck=document.createElement('div');neck.className='neck';const body=document.createElement('div');body.className='body';const label=document.createElement('div');label.className='label';label.textContent=w.name;body.appendChild(label);bottle.append(neck,body);item.appendChild(bottle)}

    function subscribeShared(){if(!sync)return;if(sync.realtime===false){subscriptionAttempt++;const previous=liveChannel;liveChannel=null;if(previous&&typeof previous.unsubscribe==='function')previous.unsubscribe();realtimeHealthy=true;syncRetry.stop();startPolling();setSyncStatus('동기화됨 · 자동 확인','ok');return}const attempt=++subscriptionAttempt,previous=liveChannel;liveChannel=null;if(previous&&typeof previous.unsubscribe==='function')previous.unsubscribe();liveChannel=sync.subscribe(()=>loadSharedData(true),(status,error)=>{if(attempt!==subscriptionAttempt)return;if(status==='SUBSCRIBED'){if(localStorage.getItem(WineSync.MIGRATION_KEY)==='dirty'){realtimeHealthy=false;syncRetry.schedule();return}realtimeHealthy=true;syncRetry.stop();stopPolling();setSyncStatus('동기화됨','ok');return}if(['CHANNEL_ERROR','TIMED_OUT','CLOSED'].includes(status)){console.error('Realtime connection failed',status,error);realtimeHealthy=false;startPolling();setSyncStatus('실시간 연결 실패 · 눌러 재시도','error',subscribeShared)}})}
    async function connectSharedCandidate(candidate,requestEpoch,generation){candidate=SessionGuard.guardClient(candidate,authGuard,generation);await WineSync.migrateLocalData(candidate,localStorage,baseWines,WineRatings.getStoredRating,ratingWriteQueue);if(!authGuard.isCurrent(generation)||requestEpoch!==syncEpoch||localStorage.getItem(WineSync.MIGRATION_KEY)==='dirty')return false;const result=await WineSync.initializeSync(candidate,()=>WineStore.getVisibleWines(baseWines,localStorage));if(!result.connected)throw result.error||new Error('Shared data connection failed');if(!authGuard.isCurrent(generation)||requestEpoch!==syncEpoch||localStorage.getItem(WineSync.MIGRATION_KEY)==='dirty')return false;sync=result.sync;wines=result.wines;ratings=result.ratings;renderShelf();setSyncStatus(sync.realtime===false?'동기화 연결 복구됨':'실시간 연결 중…');subscribeShared();return true}
    async function runStartApp(generation){renderProfiles();renderShelf();setFormRating(0);const requestEpoch=syncEpoch;try{if(!authGuard.isCurrent(generation)||!authClient||!WineAuth.personForSession(authSession))throw new Error('로그인이 필요합니다.');try{return await connectSharedCandidate(WineSync.create(authClient,authGuard.signal(generation)),requestEpoch,generation)}catch(error){if(!authGuard.isCurrent(generation))return false;if(error?.code==='MIGRATION_CONFLICT')throw error;console.error('Supabase SDK connection failed; trying REST fallback',error)}return await connectSharedCandidate(createAuthenticatedRest(generation,authSession.user.id),requestEpoch,generation)}catch(error){if(!authGuard.isCurrent(generation))return false;console.error(error);if(error?.code==='MIGRATION_CONFLICT'){showMigrationConflict(error);return {terminal:true}}sync=null;wines=WineStore.getVisibleWines(baseWines,localStorage);ratings={};renderShelf();setSyncStatus('오프라인 · 눌러 동기화 재시도','error',()=>startApp());syncRetry.schedule();return false}}
    function startApp(){if(!authSession)return Promise.resolve(false);if(migrationBlocked)return Promise.resolve({terminal:true});const generation=authGuard.snapshot();if(startPromise&&startPromiseGeneration===generation)return startPromise;const promise=runStartApp(generation);startPromise=promise;startPromiseGeneration=generation;return promise.finally(()=>{if(startPromise===promise){startPromise=null;startPromiseGeneration=-1}})}
    window.addEventListener('online',()=>{if(!authSession)return;if(!sync)startApp();else if(localStorage.getItem(WineSync.MIGRATION_KEY)==='dirty')syncRetry.trigger();else loadSharedData(true)});document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible'||!navigator.onLine||!authSession)return;if(!sync)startApp();else if(localStorage.getItem(WineSync.MIGRATION_KEY)==='dirty')syncRetry.trigger();else loadSharedData(true)});
    initializeAuth();
  </script>
